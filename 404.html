<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreenNet Pulse</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0B0F12; color: #EAF0F3; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; }
  .card { width: min(420px, calc(100% - 32px)); text-align: center; padding: 28px 20px; }
  h1 { font-size: 26px; margin: 0 0 4px; color: #61D91F; }
  .code { font-size: 20px; font-weight: 700; direction: ltr; margin: 8px 0 22px; color: #9AA8B2; }
  a.btn { display: block; padding: 16px; border-radius: 14px; background: #61D91F; color: #06110A;
          font-size: 19px; font-weight: 800; text-decoration: none; margin-bottom: 18px; }
  p { color: #9AA8B2; font-size: 15px; line-height: 1.7; margin: 6px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>GreenNet Pulse</h1>
  <div class="code" id="code"></div>
  <a class="btn" id="open" href="#">فتح في البرنامج · פתח בתוכנה · Open in the app</a>
  <p>إن لم يُفتح البرنامج، فهو غير مثبّت على هذا الهاتف. اطلبه من مسؤول الصيانة.</p>
  <p>אם התוכנה לא נפתחת, היא לא מותקנת בטלפון. בקש אותה מאחראי האחזקה.</p>
  <p>If the app does not open, it is not installed on this phone. Ask the maintenance manager.</p>
</div>
<script>
  // الرابط: /m/GN-0007 → يفتح البرنامج على صفحة الآلة
  var parts = location.pathname.split('/').filter(Boolean);
  var i = parts.lastIndexOf('m');
  var code = (i >= 0 && parts[i + 1]) ? decodeURIComponent(parts[i + 1]) : '';
  document.getElementById('code').textContent = code;
  var link = code
    ? 'intent://m/' + encodeURIComponent(code) + '#Intent;scheme=gnpulse;package=com.greennet.greennet_pulse;end'
    : 'gnpulse://';
  document.getElementById('open').href = link;
  if (code && /Android/i.test(navigator.userAgent)) { location.href = link; }
</script>
</body>
</html>
